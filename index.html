<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>ทุกคำรักหมายถึงเธอ</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #070308;
    }

    body {
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .title {
      position: fixed;
      top: 9%;
      width: 100%;
      padding: 0 20px;
      text-align: center;
      color: #ffe8ef;
      pointer-events: none;
      opacity: 0;
      animation: fade-in 1.8s ease 0.3s forwards;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(23px, 5vw, 38px);
      font-weight: 500;
      text-shadow: 0 0 22px #ff5085;
    }

    .title p {
      color: #ca91a6;
      font-size: 14px;
    }

    .message {
      position: fixed;
      bottom: 8%;
      width: 100%;
      text-align: center;
      color: #efb4c8;
      font-size: 14px;
      letter-spacing: 1px;
      opacity: 0;
      pointer-events: none;
      animation: fade-in 2s ease 7s forwards;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .title, .message {
        animation: none;
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <header class="title">
    <h1>Every word means you</h1>
    <p>ทุกคำว่ารัก…หมายถึงเธอ</p>
  </header>

  <canvas id="heart"
          role="img"
          aria-label="ข้อความรักหลายภาษาเรียงเป็นรูปหัวใจ">
  </canvas>

  <div class="message">ดีใจที่โลกนี้มีเธอ</div>

  <script>
    const canvas = document.getElementById("heart");
    const ctx = canvas.getContext("2d");

    // เปลี่ยนข้อความได้ที่นี่
    const words = [
      "ฉันรักเธอ", "I love you", "Je t’aime",
      "Te amo", "我爱你", "사랑해",
      "愛してる", "Ti amo", "รักเธอนะ",
      "Seni seviyorum", "Ich liebe dich",
      "Aku cinta kamu", "เธอคนเดียว",
      "Always you", "ที่รัก", "My love"
    ];

    const colors = [
      "#ff365f", "#ff557f", "#ff8aaa",
      "#ffc0d3", "#fff0f5", "#f84669"
    ];

    const reducedMotion = window.matchMedia(
      "(prefers-reduced-motion: reduce)"
    ).matches;

    let width = 0;
    let height = 0;
    let scale = 1;
    let startedAt = null;
    let finished = false;

    // สร้างตำแหน่งเพียงครั้งเดียว
    const count = window.innerWidth < 600 ? 210 : 320;

    const particles = Array.from({ length: count }, (_, i) => {
      const t = Math.random() * Math.PI * 2;

      // เติมทั้งขอบและด้านในของหัวใจ
      const radius = i < count * 0.28
        ? 0.94 + Math.random() * 0.06
        : Math.sqrt(Math.random()) * 0.92;

      const x = 16 * Math.pow(Math.sin(t), 3) * radius;

      const y = -(
        13 * Math.cos(t)
        - 5 * Math.cos(2 * t)
        - 2 * Math.cos(3 * t)
        - Math.cos(4 * t)
      ) * radius;

      return {
        x,
        y,
        text: words[Math.floor(Math.random() * words.length)],
        color: colors[Math.floor(Math.random() * colors.length)],
        size: 0.72 + Math.random() * 0.48,
        alpha: 0.6 + Math.random() * 0.4,
        startX: Math.random(),
        startOffset: Math.random() * 220,
        // ข้อความทยอยขึ้น ไม่ขึ้นพร้อมกันทั้งหมด
        delay: 350 + (i / count) * 4200 + Math.random() * 450,
        duration: 1900 + Math.random() * 1100
      };
    });

    const totalDuration = Math.max(
      ...particles.map(p => p.delay + p.duration)
    );

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      scale = Math.min(width / 42, height /  fifty());
      
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // ปรับขนาดโดยไม่เริ่มแอนิเมชันใหม่
      if (finished) render(totalDuration);
    }

    function fifty() {
      return 50;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function render(elapsed) {
      ctx.clearRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height * 0.49;

      const glow = ctx.createRadialGradient(
        cx, cy, 0, cx, cy, scale * 23
      );

      glow.addColorStop(0, "rgba(135, 18,  sixty(), 0.18)"
        .replace("sixty()", "60"));
      glow.addColorStop(1, "rgba(7, 3, 8, 0)");

      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, width, height);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const baseSize = Math.max(9, Math.min(18, width /  forty()));

      for (const p of particles) {
        const progress = Math.max(
          0,
          Math.min(1, (elapsed - p.delay) / p.duration)
        );

        if (progress === 0) continue;

        const eased = easeOutCubic(progress);

        const targetX = cx + p.x * scale;
        const targetY = cy + p.y * scale;

        const fromX = width * p.startX;
        const fromY = height + 60 + p.startOffset;

        const x = fromX + (targetX - fromX) * eased;
        const y = fromY + (targetY - fromY) * eased;

        ctx.globalAlpha = p.alpha * Math.min(1, progress * 3);
        ctx.fillStyle = p.color;
        ctx.font = `600 ${baseSize * p.size}px Arial, sans-serif`;
        ctx.fillText(p.text, x, y);
      }

      ctx.globalAlpha = 1;
    }

    function forty() {
      return  fortyValue;
    }

    const fortyValue =  fortyNumber();
    function fortyNumber() {
      return 40;
    }

    function animate(now) {
      if (startedAt === null) startedAt = now;

      const elapsed = now - startedAt;
      render(elapsed);

      if (elapsed < totalDuration) {
        requestAnimationFrame(animate);
      } else {
        // จบแล้วหยุด ไม่มีการเล่นซ้ำ
        finished = true;
      }
    }

    resize();

    if (reducedMotion) {
      finished = true;
      render(totalDuration);
    } else {
      requestAnimationFrame(animate);
    }

    window.addEventListener("resize", resize);
  </script>
</body>
</html>
